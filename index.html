<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swiggy Clone</title>
    <link rel="stylesheet" href="nav.css">
    <link rel="stylesheet" href="hero.css">
    <link rel="stylesheet" href="resturant.css">
    <link rel="stylesheet" href="onlineresturant.css">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
</head>

<body>
    <header>
        <nav class="nav-container">
            <a href="#">
                <img class="swiggy-logo" src="images/swiggy.png" alt="logo of swiggy">
            </a>
            <a href="#">Bamunara,West Bengal 713212</a>
            <a href="#">
                <span class="material-symbols-outlined">
                    enterprise
                </span>
                Swiggy Corporate
            </a>
            <a href="#">
                <span class="material-symbols-outlined">
                    search
                </span>
                Search
            </a>
            <a href="#">
                <span class="material-symbols-outlined">
                    percent
                </span>
                Offers <sup>NEW</sup>
            </a>
            <a href="#">
                <span class="material-symbols-outlined">
                    help
                </span>
                Help
            </a>
            <a href="#">
                <span class="material-symbols-outlined">
                    login
                </span>
                Sign In
            </a>
            <a href="#">
                <span class="material-symbols-outlined">
                    shopping_basket
                </span>
                Cart
            </a>
        </nav>
    </header>
    <main>
        <section>
            <p class="heading">What's on your mind?</p>
            <div class="hero-container">

                <div class="logo">
                    <a href=""> <img src="images/burger.png" alt="image of a burger"></a>

                </div>
                <div class="logo">
                    <a href=""> <img src="images/pizza.png" alt="image of a pizza"></a>

                </div>
                <div class="logo">
                    <a href=""><img src="images/biryani.png" alt="image of a biryani"></a>

                </div>
                <div class="logo">
                    <a href=""> <img src="images/north indian.png" alt="image of north indian"></a>

                </div>
                <div class="logo">
                    <a href=""> <img src="images/chinese.png" alt="image of chinese"></a>

                </div>
                <div class="logo">
                    <a href=""> <img src="images/rolls.png" alt="images of roll"></a>

                </div>
                <div class="logo">
                    <a href=""> <img src="images/paratha.png" alt="image of paratha"></a>

                </div>

            </div>
        </section>
        <p class="resturant">Top restaurant chains in Durgapur</p>
        <section>
            <div class="resturant-chains">
                <div class="logo">
                    <a href="">
                        <img class="one" src="images/one.png" alt="">
                    </a>
                </div>
                <div class="logo">
                    <a href="">
                        <img class="two" src="images/two.png" alt="">
                    </a>
                </div>
                <div class="logo">
                    <a href="">
                        <img class="three" src="images/three.png" alt="">
                    </a>
                </div>
                <div class="logo">
                    <a href="">
                        <img class="four" src="images/four.png" alt="">
                    </a>
                </div>
            </div>
        </section>
        <section>
            <p class="online">Restaurant with online food delivery in Durgapur</p>
            <select class="list" name="" id="">
                <option value="">Sort By</option>
                <option value="">Relevance</option>
                <option value="">Delivery Time</option>
                <option value="">Rating</option>
                <option value="">Cost:Low to High</option>
                <option value="">Cost:High to Low</option>
                <button>Apply</button>
            </select>
        </section>        
    </main>
</body>

</html>
